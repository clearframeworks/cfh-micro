name: Prepare CFH Text draft release
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare exact verified installer draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh api repos/clearframeworks/cfh-micro/actions/runs/42380652179 --jq '.head_sha + " " + .conclusion')
          test "$run" = '5c4e7836cf1430532fc0ebe99f0280abe881b6c8 success'
          gh run download 42380652179 --repo clearframeworks/cfh-micro --name cfh-text-installer-unsigned --dir "$RUNNER_TEMP/installer"
          file="$RUNNER_TEMP/installer/CFH-Text-Setup.exe"
          echo '254f29c658d793d902220fed2958afc5d694732f80040505f7497b0f30443670  '"$file" | sha256sum -c -
          if gh release view cfh-text-0.1.0 --repo clearframeworks/cfh-micro >/dev/null 2>&1; then echo 'Release already exists; refusing to replace'; exit 1; fi
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          CFH Text is a free Windows terminal text editor based on Micro v2.0.15. It adds `-cfh-inspect FILE...` to print a file's SHA-256 fingerprint and size. A fingerprint is not a malware scan.

          **Windows installer:** `CFH-Text-Setup.exe` is unsigned. Windows may show a publisher warning. SHA-256: `254f29c658d793d902220fed2958afc5d694732f80040505f7497b0f30443670`.

          This release is an independent CFH fork of [Micro](https://github.com/micro-editor/micro), base commit `6a62575bcfdf4965f187eedafceb3400316e612b`. Micro and its contributors retain their copyright. The MIT license and fork notice are included in the installer. [Source for this release](https://github.com/clearframeworks/cfh-micro/tree/5c4e7836cf1430532fc0ebe99f0280abe881b6c8).

          The installed editor was tested opening, editing and saving a harmless file on an isolated Windows runner. Dependency scanning checks known issues and does not guarantee security.
          NOTES
          gh release create cfh-text-0.1.0 "$file" --repo clearframeworks/cfh-micro --target 5c4e7836cf1430532fc0ebe99f0280abe881b6c8 --title 'CFH Text 0.1.0' --notes-file "$RUNNER_TEMP/notes.md" --draft
name: Prepare CFH Text draft release
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare exact verified installer draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh api repos/clearframeworks/cfh-micro/actions/runs/42402139417 --jq '.head_sha + " " + .conclusion')
          test "$run" = '04c01331a3088cf81a6f0d96196e0a0ddb2f16ee success'
          gh run download 42402139417 --repo clearframeworks/cfh-micro --name cfh-text-installer-unsigned --dir "$RUNNER_TEMP/installer"
          file="$RUNNER_TEMP/installer/CFH-Text-Setup.exe"
          echo 'fcef52df24a8eff30b8494b170ec5eb3f802fd806cc93693976260524c9a38e0  '"$file" | sha256sum -c -
          gh release upload cfh-text-0.1.1 "$file" --repo clearframeworks/cfh-micro

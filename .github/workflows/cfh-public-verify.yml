name: Verify public CFH Text release
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download published installer without credentials
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/CFH-Text-Setup.exe" 'https://github.com/clearframeworks/cfh-micro/releases/download/cfh-text-0.1.1/CFH-Text-Setup.exe'
          echo 'fcef52df24a8eff30b8494b170ec5eb3f802fd806cc93693976260524c9a38e0  '"$RUNNER_TEMP/CFH-Text-Setup.exe" | sha256sum -c -
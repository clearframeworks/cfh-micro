name: Preview Text Go dependency update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9170affcf393a700995597e7eb0cfdc1d1aa4e86
          persist-credentials: false
      - name: Resolve fixed versions without publishing
        run: |
          set -euo pipefail
          go get golang.org/x/sys@v0.44.0 golang.org/x/text@v0.41.0
          git diff -- go.mod go.sum
          echo BEGIN_GOMOD
          base64 -w0 go.mod; echo
          echo END_GOMOD
          echo BEGIN_GOSUM
          base64 -w0 go.sum; echo
          echo END_GOSUM
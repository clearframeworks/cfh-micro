name: CFH Text shipped binary security investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9170affcf393a700995597e7eb0cfdc1d1aa4e86
          persist-credentials: false
      - name: Install Go vulnerability scanner
        shell: pwsh
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          if($LASTEXITCODE -ne 0){throw 'govulncheck install failed'}
      - name: Install exact public release and inspect binary
        shell: pwsh
        run: |
          $file="$env:RUNNER_TEMP\setup.exe"
          Invoke-WebRequest 'https://github.com/clearframeworks/cfh-micro/releases/download/cfh-text-0.1.0/CFH-Text-Setup.exe' -OutFile $file
          if((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a168969e3a134d27e62d2a35a8ff1228c1b6b000c2ba34104928e71be2a0fc39'){throw 'Installer checksum mismatch'}
          $dir="$env:RUNNER_TEMP\installed"
          $p=Start-Process $file -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0 -or !(Test-Path "$dir\cfh-text.exe")){throw 'Install failed'}
          go version -m "$dir\cfh-text.exe"
          & "$(go env GOPATH)\bin\govulncheck.exe" -mode binary "$dir\cfh-text.exe"
          Write-Output "BINARY SCAN EXIT: $LASTEXITCODE"
      - name: Inspect source reachability
        shell: pwsh
        run: |
          go generate ./runtime
          if($LASTEXITCODE -ne 0){throw 'Runtime generation failed'}
          & "$(go env GOPATH)\bin\govulncheck.exe" ./...
          Write-Output "SOURCE SCAN EXIT: $LASTEXITCODE"